# 复制到 ~/.job-outreach/config.yaml 后填写授权码相关环境变量
# 主功能：轮询九家公司官网，发现全新岗位立即推送到用户邮箱
# 外投简历：已关闭

mode: digest

mail:
  provider: smtp
  from_email: "3461630168@qq.com"
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  smtp_ssl: true
  smtp_username: "3461630168@qq.com"
  # export JOB_OUTREACH_SMTP_PASSWORD='你的授权码'
  max_retries: 3
  retry_base_delay_sec: 2
  min_interval_sec: 8
  max_attachment_mb: 5
  timeout_sec: 30

digest:
  to_email: "3461630168@qq.com"
  # 单次推送软上限（防止一次更新过多撑爆邮件）；不是「必须凑满」
  max_per_push: 30
  subject: "【新岗位速递】{datetime} · {count} 条更新"
  user_note: "以下为官网新出现的匹配岗位，请尽快投递。"
  keywords:
    - Java
    - 后端
    - 实习
    - 校招
    - Agent
    - 开发

crawl:
  timeout_sec: 60
  playwright_wait_ms: 6000
  limit_per_company: 40
  # 首次运行只建立基线（标记已见），不把存量岗位全部推送
  baseline_on_first_run: true

email:
  from_name: "邵俊凯"

paths:
  companies: "~/.job-outreach/companies.csv"
  state: "~/.job-outreach/state.json"
  jobs_cache: "~/.job-outreach/cache"

schedule:
  timezone: "Asia/Shanghai"
  # 无固定发送时刻：持续轮询，有新岗位立刻推送
  poll_interval_sec: 600
  enable_outreach_slots: false

security:
  blocked_domains:
    - example.com
    - mailinator.com

report:
  dir: "~/.job-outreach/reports"
